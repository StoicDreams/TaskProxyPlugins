[workspace]
resolver = "2"
members = ["sdk", "test-plugin", "plugins/jira"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Erik Gassler <erik@gassler.us>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taskproxy-plugin-sdk = { path = "sdk" }

# Plugins are downloaded by every user who installs them, so keep them small.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
